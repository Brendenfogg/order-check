[package]
name = "order-check"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hound = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strsim = "0.11.1"
thiserror = "2.0.21"
toml = "1.1.8"
whisper-rs = { version = "0.16.0", features = ["metal"] }

[[bin]]
name = "order-check"
path = "src/main.rs"

# whisper.cpp is unusably slow unoptimized; keep it fast in test builds too.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
