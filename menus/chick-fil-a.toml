# Chick-fil-A menu for Order Check.
# Everything the system knows about this restaurant lives in this file.
# Aliases are written already normalized: lowercase, no punctuation,
# "chick fil a" as three words, numbers as digits, "N count" for nugget/strip counts.

restaurant = "Chick-fil-A"
lto_items = ["peach_shake"]

[meal]
default_side = "waffle_fries"
default_size = "md"
upcharge = 3.80

# ---------------------------------------------------------------- families
# A family groups look-alike items. Saying only the family word ("nuggets")
# leaves the exact item unspecified. "regular" resolves to the family base.

[[families]]
id = "sandwich"
base = "chicken_sandwich"
aliases = ["sandwich"]

[[families]]
id = "nuggets"
base = "nuggets_8"
aliases = ["nuggets", "nugget", "nugs"]

[[families]]
id = "grilled_nuggets"
base = "grilled_nuggets_8"
aliases = ["grilled nuggets", "grilled nugget", "grill nuggets", "grill nugget"]

[[families]]
