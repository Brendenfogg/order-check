# A generic burger-and-chicken menu, to show that Order Check isn't tied to one
# restaurant: swap this file in with --menu menus/generic-grill.toml.
# Aliases are written already normalized (lowercase, numbers as digits).

restaurant = "Generic Grill"
lto_items = []

[meal]
default_side = "fries"
